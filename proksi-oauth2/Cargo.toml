[package]
name = "proksi-oauth2"
version = "0.5.3"
edition = "2021"
authors = ["Edited by Ali Raeini, copied from Proksi crate by The Proksi Contributors <toaster.chicory-0b@icloud.com>"]
license = "MIT OR Apache-2.0"
homepage = "TODO"
repository = "TODO"
keywords = ["proksi", "oauth2"]

[lib]
name = "proksi_oauth2"
path = "src/mod.rs"

[dependencies]
anyhow = "1.0.100"
cookie.workspace = true
http.workspace = true
itertools = "0.14.0"
jsonwebtoken = { version = "10.2", features = ["rust_crypto"] }
once_cell = "1.21.3"
reqwest = { workspace = true, features = ["json", "form"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

