[package]
name = "proksi-oauth2"
version = "0.5.3"
edition = "2021"
authors = ["Edited by Ali Raeini, copied from Proksi crate by The Proksi Contributors <toaster.chicory-0b@icloud.com>"]
license = "MIT OR Apache-2.0"
homepage = "TODO"
repository = "TODO"
keywords = ["proksi", "oauth2"]

[lib]
name = "proksi_oauth2"
path = "src/mod.rs"

[dependencies]
sentry-core = { version = "0.26.0", default-features = false }
anyhow = "1.0.97"
reqwest = { version = "0.12.12", features = ["json"] }
serde = "1.0.218"
serde_json = "1.0.139"
async-trait = "0.1.87"
cookie = "0.18.1"
once_cell = "1.13.0"
itertools = "0.14.0"
tracing = "0.1.41"
short-crypt = "1.0.28"
uuid = "1.15.1"
http = "1.2.0"
jsonwebtoken = "8.2.0"
bytes = { workspace = true }
pingap-config = { version = "0.10.4", path = "../pingap-config" }
pingap-core = { version = "0.10.4", path = "../pingap-core" }
#pingora = { version = "0.4.0", default-features = false, features = [
    #"lb",
    #"openssl",
    #"cache",
#] }
